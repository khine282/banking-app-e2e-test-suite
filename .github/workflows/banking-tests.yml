name: Banking QA Test Suite - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Banking QA Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Install Chrome browser
      uses: browser-actions/setup-chrome@latest
    
    - name: Install ChromeDriver
      uses: nanasess/setup-chromedriver@master
      with:
        chromedriver-version: 120.0.6099.129
    
    - name: Compile project
      run: mvn clean compile
      continue-on-error: false
    
    - name: Run Banking QA Test Suite
      run: mvn test -Dmaven.test.failure.ignore=true
      continue-on-error: true
    
    - name: Generate Allure Report
      if: always()
      run: mvn allure:report
    
    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: allure-results
        path: target/allure-results
    
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-reports
        path: target/surefire-reports
    
    - name: Upload Screenshots on Failure
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: failure-screenshots
        path: target/screenshots
    
    - name: Test Summary
      if: always()
      run: |
        echo "🏦 Banking QA Test Suite Execution Complete"
        echo "Tests run and results uploaded as artifacts"
        if [ -f target/surefire-reports/index.html ]; then
          echo "✅ Full test report available in artifacts"
        fi
    
    - name: Publish Test Report Comment
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const testReportPath = 'target/surefire-reports/index.html';
          if (fs.existsSync(testReportPath)) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🏦 **Banking QA Test Suite Results**\n\nTest reports have been generated. Check the "Artifacts" section for detailed results.'
            });
          }

  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    name: Publish Allure Report
    
    steps:
    - name: Download Allure Results
      uses: actions/download-artifact@v3
      with:
        name: allure-results
        path: allure-results
    
    - name: Publish Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-report
      continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    name: Test Status Notification
    
    steps:
    - name: Determine Test Status
      run: |
        if [ "${{ needs.test.result }}" == "success" ]; then
          echo "✅ All tests passed!"
          echo "STATUS=PASSED" >> $GITHUB_ENV
        else
          echo "❌ Some tests failed or encountered errors"
          echo "STATUS=FAILED" >> $GITHUB_ENV
        fi
    
    - name: Log Test Status
      run: echo "🏦 Banking QA Test Suite Status: ${{ env.STATUS }}"
