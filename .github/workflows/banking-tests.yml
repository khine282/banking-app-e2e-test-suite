name: Banking QA Test Suite - CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Banking QA Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Install Chrome browser
      uses: browser-actions/setup-chrome@latest
    
    
    - name: Compile project
      run: mvn clean compile
      continue-on-error: false
    
    - name: Run Banking QA Test Suite
      run: mvn test -Dmaven.test.failure.ignore=true
      continue-on-error: true
    
    - name: Generate Allure Report
      if: always()
      run: mvn allure:report

    - name: Debug Workspace Structure
      if: always()
      run: |
        echo "=== Current Directory ==="
        ls -la
        echo "=== Target Directory ==="
        ls -la target/ || echo "No target folder found"
    
    - name: Verify Allure Results
      if: always()
      run: |
        echo "==== Current Directory ===="
        pwd

        echo "==== Find allure-results ===="
        find . -type d -name "allure-results"

        echo "==== Root ===="
        ls -la

        echo "==== Allure Results ===="
        ls -R allure-results || true

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results
        if-no-files-found: error
    
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/surefire-reports
    
    - name: Upload Screenshots on Failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots
        path: target/screenshots
    
    - name: Test Summary
      if: always()
      run: |
        echo "Banking QA Test Suite Execution Complete"
        echo "Tests run and results uploaded as artifacts"
        if [ -f target/surefire-reports/index.html ]; then
          echo "✅ Full test report available in artifacts"
        fi
    
    # ✅ NEW CODE (Use this instead)
    - name: Publish Test Report Comment
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const testReportPath = 'target/surefire-reports/index.html';
          if (fs.existsSync(testReportPath)) {
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🏦 **Banking QA Test Suite Results**\n\nTest reports have been generated. Check the "Artifacts" section for detailed results.'
            });
          }

  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    name: Publish Allure Report

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

    # ===== DEBUG STEP 1 =====
      - name: Show Allure Maven Plugin Version
        run: mvn help:effective-pom | grep -A5 "allure-maven"

    # ===== GENERATE REPORT =====
      - name: Generate Allure Report
        run: mvn allure:report

    # ===== DEBUG STEP 2 =====
      - name: Inspect Generated Report
        run: |
          echo "=== target/site ==="
          find target/site -maxdepth 3 -type f

    # ===== PUBLISH =====
      - name: Publish Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin


  notify:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    name: Test Status Notification
    
    steps:
    - name: Determine Test Status
      run: |
        if [ "${{ needs.test.result }}" == "success" ]; then
          echo "✅ All tests passed!"
          echo "STATUS=PASSED" >> $GITHUB_ENV
        else
          echo "❌ Some tests failed or encountered errors"
          echo "STATUS=FAILED" >> $GITHUB_ENV
        fi
    
    - name: Log Test Status
      run: |
        echo "Test Suite Status: ${{ env.STATUS }}"