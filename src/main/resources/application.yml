@"
   banking:
     app-url: https://parabank.parasoft.com
     api-base-url: https://parabank.parasoft.com/parabank/services
   
   test:
     browser:
       type: chrome
       headless: false
       implicit-wait: 10
       explicit-wait: 30
       page-load-timeout: 60
     screenshot:
       enabled: true
       on-failure: true
       path: target/screenshots
   
   logging:
     level:
       root: INFO
       com.parabank: DEBUG
   "@ | Out-File -Encoding UTF8 "src\main\resources\application.yml"
